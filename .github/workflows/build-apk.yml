name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking java -version:"
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          echo "Detected version line: ${JAVA_VER_LINE}"

          MAJOR_VERSION="$(echo "${JAVA_VER_LINE}" | sed -nE 's/.*version "([0-9]+)(\.[0-9]+.*)?".*/\1/p')"
          if [ "${MAJOR_VERSION}" = "1" ]; then
            MAJOR_VERSION="$(echo "${JAVA_VER_LINE}" | sed -nE 's/.*version "1\.([0-9]+)\..*".*/\1/p')"
          fi

          if [ -z "${MAJOR_VERSION}" ]; then
            echo "::error::Unable to detect the active Java major version."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FILE="./debug.keystore"
          if [ -f "${KEYSTORE_FILE}" ]; then
            echo "Existing ./debug.keystore found; skipping generation."
          else
            echo "Generating temporary ./debug.keystore using Java 17 keytool..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

          if [ ! -f "${KEYSTORE_FILE}" ] || [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Confirmed ./debug.keystore is present and non-empty."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK was not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk for diagnostic listing:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty (0 bytes)."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Unexpected APK path ${EXPECTED_APK}."
            exit 1
          fi

          APK_SIZE_BYTES="$(wc -c < "${EXPECTED_APK}" | tr -d '[:space:]')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE_BYTES} bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified debug APK is missing or empty at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          TEMP_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-asset-XXXXXX")"
          DEST_ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "${SOURCE_APK}" "${DEST_ASSET_PATH}"

          if [ ! -f "${DEST_ASSET_PATH}" ] || [ ! -s "${DEST_ASSET_PATH}" ]; then
            echo "::error::Failed to prepare release APK asset at ${DEST_ASSET_PATH}."
            exit 1
          fi

          echo "Prepared release asset: ${DEST_ASSET_PATH}"
          {
            echo "asset_path=${DEST_ASSET_PATH}"
            echo "asset_name=${ASSET_FILENAME}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying GitHub CLI availability:"
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          TARGET_COMMIT="${GITHUB_SHA}"

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::warning::Prepared release asset does not exist or is empty: ${ASSET_PATH}"
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset does not have a .apk extension: ${ASSET_PATH}"
              exit 1
              ;;
          esac

          RELEASE_NOTES="$(cat <<EOF
          ### Automatically Generated Debug APK

          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **GitHub Actions Run Number:** \`${GITHUB_RUN_NUMBER}\`
          - **GitHub Actions Run Attempt:** \`${GITHUB_RUN_ATTEMPT}\`
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Asset Filename:** \`${ASSET_NAME}\`

          #### Important Notice
          - This APK is intended for testing only.
          - This APK is **not** a Play Store production release.
          - This APK is signed only with a temporary debug keystore generated on the GitHub Actions runner.
          EOF
          )"

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --target "${TARGET_COMMIT}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url' 2>/dev/null || true)"
            if [ -n "${RELEASE_URL}" ]; then
              echo "GitHub Release published successfully!"
              echo "Release Tag: ${RELEASE_TAG}"
              echo "Release Title: ${RELEASE_TITLE}"
              echo "Release Page URL: ${RELEASE_URL}"
              echo "APK Asset Filename: ${ASSET_NAME}"

              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
                echo "- **GitHub Release Status:** Published"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **Release Page URL:** ${RELEASE_URL}"
                echo "- **Direct APK Asset Filename:** \`${ASSET_NAME}\`"
                echo ""
                echo "You can download \`${ASSET_NAME}\` directly from the **Assets** section on the GitHub Release page above."
                echo "The standard GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run page as a backup."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          echo "::warning::GitHub Release publishing did not succeed, but the debug APK build and artifact upload succeeded. Download the APK from the GitHub Actions artifact named 'app-debug-apk'."
          echo "APK Build Status: Succeeded"
          echo "Backup Actions Artifact Name: app-debug-apk"

          {
            echo "## Debug APK Build & Release Summary"
            echo ""
            echo "> **Warning:** GitHub Release publishing did not succeed."
            echo ""
            echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
            echo "- **Backup Actions Artifact:** \`app-debug-apk\` (available on this workflow run summary page)"
            echo ""
            echo "Download the built debug APK from the **Artifacts** section of this workflow run under the name \`app-debug-apk\`."
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0
