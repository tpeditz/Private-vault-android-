name: Build Debug CI Test Artifact (Non-Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking java -version:"
          java -version
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FILE="./debug.keystore"
          if [ -f "${KEYSTORE_FILE}" ] && [ -s "${KEYSTORE_FILE}" ]; then
            echo "Existing ./debug.keystore found; preserving existing keystore."
          elif [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            echo "Decoding ./debug.keystore from configured DEBUG_KEYSTORE_BASE64 secret..."
            printf '%s' "${DEBUG_KEYSTORE_B64}" | tr -d '[:space:]' | base64 -d > "${KEYSTORE_FILE}"
          else
            echo "Generating temporary ./debug.keystore using Java 17 keytool..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

          if [ ! -f "${KEYSTORE_FILE}" ] || [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi

      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Remove temporary debug keystore file
        if: always()
        shell: bash
        run: |
          rm -f ./debug.keystore

      - name: Verify debug APK output
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ] || [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK was not found or is empty at ${EXPECTED_APK}."
            exit 1
          fi
          APK_SIZE_BYTES="$(wc -c < "${EXPECTED_APK}" | tr -d '[:space:]')"
          echo "Verified debug CI artifact: ${EXPECTED_APK} (${APK_SIZE_BYTES} bytes)"

      - name: Upload debug APK CI test artifact (never published as a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Write CI summary notice
        if: always()
        shell: bash
        run: |
          {
            echo "## Debug CI Build Summary (Testing Artifact Only)"
            echo ""
            echo "- **Build Variant:** \`debug\` (\`versionNameSuffix = -debug\`, \`debuggable = true\`)"
            echo "- **Artifact Name:** \`app-debug-apk-test-only\`"
            echo "- **Production Release Policy:** Debug APKs are **never** published to GitHub Releases. To publish a signed, non-debuggable production OTA release (\`assembleRelease\`), run the **Publish Signed OTA Release** workflow (\`.github/workflows/publish-ota.yml\`)."
          } >> "${GITHUB_STEP_SUMMARY}"
