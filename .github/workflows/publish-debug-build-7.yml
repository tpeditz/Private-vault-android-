name: Publish Debug APK Build 7

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes (optional)"
        required: false
        type: string
        default: "Debug Build 7. Fresh APK built from the main branch. Testing release; not a production-signed OTA update."

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_FILE="./debug.keystore"
          if [ -f "${KEYSTORE_FILE}" ] && [ -s "${KEYSTORE_FILE}" ]; then
            echo "Using repository-provided debug keystore."
          elif [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            printf '%s' "${DEBUG_KEYSTORE_B64}" | tr -d '[:space:]' | base64 -d > "${KEYSTORE_FILE}"
          else
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi
          test -s "${KEYSTORE_FILE}"

      - name: Run unit tests and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and name APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="private-vault-android-debug-build-7.apk"
          test -s "${SOURCE_APK}"
          cp "${SOURCE_APK}" "${RELEASE_APK}"
          echo "path=${RELEASE_APK}" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(sha256sum "${RELEASE_APK}" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="debug-apk-build-7-1"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag ${TAG} already exists. Refusing to overwrite it."
            exit 1
          fi
          NOTES="${RELEASE_NOTES:-Debug Build 7. Fresh APK built from the main branch. Testing release; not a production-signed OTA update.}"
          NOTES="${NOTES}

          APK: private-vault-android-debug-build-7.apk
          Version code: 7
          Version name: 1.0.6
          SHA-256: ${{ steps.apk.outputs.sha256 }}

          This is a debug/testing build, not a production-signed OTA release."
          gh release create "${TAG}" "${{ steps.apk.outputs.path }}#private-vault-android-debug-build-7.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Debug APK Build #7" \
            --prerelease \
            --notes "${NOTES}"

      - name: Remove local debug keystore
        if: always()
        run: rm -f ./debug.keystore
