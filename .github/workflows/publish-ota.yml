name: Publish Verified OTA Update

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'Signing identity mode (release_keystore for production release, debug_compatibility for controlled non-production test builds only)'
        required: true
        default: 'release_keystore'
        type: choice
        options:
          - release_keystore
          - debug_compatibility
      expected_signer_sha256:
        description: 'Optional expected colon-separated or hex SHA-256 certificate fingerprint of the installed production signer (verified before publishing)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Release notes for update.json and GitHub Release'
        required: true
        default: 'PRIVATE VAULT v1.0.5 encrypted photo & video vault, security, and release hardening update.'
        type: string
      min_supported_version_code:
        description: 'Minimum supported versionCode for OTA upgrade'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    env:
      PUBLIC_OTA_REPO: 'tpeditz/Private-vault-updates'

    steps:
      - name: Preflight verify secrets and configuration
        env:
          OTA_TOKEN: ${{ secrets.OTA_REPO_TOKEN }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
          RELEASE_KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEBUG_KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OTA_TOKEN:-}" ]; then
            echo "::error::Missing required repository secret OTA_REPO_TOKEN. Add OTA_REPO_TOKEN with Contents read/write access to ${PUBLIC_OTA_REPO} under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ "${SIGNING_MODE}" = "release_keystore" ]; then
            if [ -z "${RELEASE_KS_B64:-}" ] || [ -z "${RELEASE_STORE_PASS:-}" ] || [ -z "${RELEASE_KEY_ALIAS:-}" ] || [ -z "${RELEASE_KEY_PASS:-}" ]; then
              echo "::error::signing_mode=release_keystore requires RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD secrets. Refusing to fall back to debug key."
              exit 1
            fi
          else
            echo "::warning::NON-PRODUCTION BUILD: signing_mode=debug_compatibility is strictly for controlled test builds."
            if [ -z "${DEBUG_KS_B64:-}" ]; then
              echo "::error::debug_compatibility mode requires the DEBUG_KEYSTORE_BASE64 secret. Committed keystore files in the repository are prohibited."
              exit 1
            fi
          fi
          echo "Preflight secret validation passed for signing_mode=${SIGNING_MODE}."

      - name: Checkout private source repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java 21 environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking java -version:"
          java -version
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi
          if ! java -version 2>&1 | grep -qE 'version "21(\.|")'; then
            echo "::error::Expected Java 21 runtime for Android API 36 / Robolectric 4.16.1."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare and validate signing keystore in runner temp
        id: signing_prep
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          RELEASE_KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEBUG_KS_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SIGNING_MODE}" = "release_keystore" ]; then
            KS_PATH="${RUNNER_TEMP}/release-signing.jks"
            printf '%s' "${RELEASE_KS_B64}" | tr -d '[:space:]' | base64 -d > "${KS_PATH}"
            if [ ! -s "${KS_PATH}" ]; then
              echo "::error::Decoded release keystore is empty."
              exit 1
            fi

            # Verify that the keystore opens and contains the configured alias
            if ! "${JAVA_HOME}/bin/keytool" -list -keystore "${KS_PATH}" -storepass "${RELEASE_STORE_PASS}" -alias "${RELEASE_KEY_ALIAS}" >/dev/null 2>&1; then
              echo "::error::Release keystore does not contain configured alias '${RELEASE_KEY_ALIAS}' or store password is invalid."
              exit 1
            fi

            # Align the temporary keystore alias with Gradle's release signingConfig ('upload') if different
            if [ "${RELEASE_KEY_ALIAS}" != "upload" ]; then
              "${JAVA_HOME}/bin/keytool" -changealias \
                -keystore "${KS_PATH}" \
                -storepass "${RELEASE_STORE_PASS}" \
                -keypass "${RELEASE_KEY_PASS}" \
                -alias "${RELEASE_KEY_ALIAS}" \
                -destalias "upload" >/dev/null 2>&1
            fi
            echo "keystore_path=${KS_PATH}" >> "${GITHUB_OUTPUT}"
          else
            KS_PATH="./debug.keystore"
            printf '%s' "${DEBUG_KS_B64}" | tr -d '[:space:]' | base64 -d > "${KS_PATH}"
            if [ ! -s "${KS_PATH}" ]; then
              echo "::error::Decoded debug keystore is empty."
              exit 1
            fi
            echo "keystore_path=${KS_PATH}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run JVM and Robolectric verification suite
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon

      - name: Build signed candidate APK
        id: build_apk
        env:
          SIGNING_MODE: ${{ inputs.signing_mode }}
          KEYSTORE_PATH: ${{ steps.signing_prep.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PV_RELEASE_STORE_FILE: ${{ steps.signing_prep.outputs.keystore_path }}
          PV_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          PV_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PV_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SIGNING_MODE}" = "release_keystore" ]; then
            gradle :app:assembleRelease --stacktrace --no-daemon
            BUILT_APK="app/build/outputs/apk/release/app-release.apk"
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
            BUILT_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -f "${BUILT_APK}" ] || [ ! -s "${BUILT_APK}" ]; then
            echo "::error::Built APK not found or empty at ${BUILT_APK}."
            exit 1
          fi
          echo "built_apk=${BUILT_APK}" >> "${GITHUB_OUTPUT}"

      - name: Verify APK signature, signer certificate SHA-256, and package identity
        id: verify_signer
        env:
          BUILT_APK: ${{ steps.build_apk.outputs.built_apk }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
          EXPECTED_CERT: ${{ inputs.expected_signer_sha256 }}
          SECRET_EXPECTED_CERT: ${{ secrets.EXPECTED_PRODUCTION_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_OUTPUT="$("${JAVA_HOME}/bin/keytool" -printcert -jarfile "${BUILT_APK}")"
          if ! echo "${CERT_OUTPUT}" | grep -q "SHA256:"; then
            echo "::error::Built APK at ${BUILT_APK} is not signed with a verifiable certificate."
            exit 1
          fi

          ACTUAL_CERT_COLON="$(echo "${CERT_OUTPUT}" | sed -nE 's/.*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT_HEX="$(echo "${ACTUAL_CERT_COLON}" | tr -d ':')"
          echo "Verified APK Signer Certificate SHA-256: ${ACTUAL_CERT_COLON}"

          # Refuse to publish a production release if it was accidentally signed with the public Android debug certificate
          DEBUG_CERT_HEX="12943A916928049269C02D8D971B5967A041FB6C7DB25A1279D3414E45CFB561"
          if [ "${SIGNING_MODE}" = "release_keystore" ] && [ "${ACTUAL_CERT_HEX}" = "${DEBUG_CERT_HEX}" ]; then
            echo "::error::CRITICAL: release_keystore mode produced an APK signed with the known debug certificate! Aborting release."
            exit 1
          fi

          # Verify merged release manifest has debuggable=false and no development PreviewActivity
          if [ "${SIGNING_MODE}" = "release_keystore" ]; then
            MERGED_MANIFEST="app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"
            if [ -f "${MERGED_MANIFEST}" ]; then
              if grep -q 'android:debuggable="true"' "${MERGED_MANIFEST}"; then
                echo "::error::CRITICAL: Merged release manifest has android:debuggable=true! Aborting release."
                exit 1
              fi
              if grep -q 'PreviewActivity' "${MERGED_MANIFEST}"; then
                echo "::error::CRITICAL: Merged release manifest contains development PreviewActivity! Aborting release."
                exit 1
              fi
              echo "Confirmed merged release manifest has debuggable=false and zero PreviewActivity entries."
            fi
          fi

          TARGET_EXPECTED="${EXPECTED_CERT:-${SECRET_EXPECTED_CERT:-}}"
          if [ -n "${TARGET_EXPECTED}" ]; then
            NORM_EXPECTED="$(echo "${TARGET_EXPECTED}" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
            if [ "${ACTUAL_CERT_HEX}" != "${NORM_EXPECTED}" ]; then
              echo "::error::APK signer certificate (${ACTUAL_CERT_COLON}) does NOT match expected installed production signer (${TARGET_EXPECTED}). Users would not be able to install this update in place!"
              exit 1
            fi
            echo "Confirmed APK signer matches expected installed production signer."
          fi
          echo "signer_sha256=${ACTUAL_CERT_COLON}" >> "${GITHUB_OUTPUT}"

      - name: Extract single-source-of-truth APK metadata and generate update.json
        id: apk_meta
        env:
          BUILT_APK: ${{ steps.build_apk.outputs.built_apk }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          MIN_SUPPORTED_CODE: ${{ inputs.min_supported_version_code }}
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"

          if [ "${APP_ID}" != "com.tpeditz.privatevault" ]; then
            echo "::error::Unexpected applicationId '${APP_ID}' (expected com.tpeditz.privatevault)."
            exit 1
          fi

          if [ -z "${VERSION_CODE}" ] || [ -z "${VERSION_NAME}" ]; then
            echo "::error::Failed to extract versionCode or versionName from app/build.gradle.kts."
            exit 1
          fi

          APK_SHA256="$(sha256sum "${BUILT_APK}" | awk '{print tolower($1)}')"
          APK_SIZE_BYTES="$(wc -c < "${BUILT_APK}" | tr -d '[:space:]')"
          PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          if [ "${SIGNING_MODE}" = "debug_compatibility" ]; then
            RELEASE_TAG="v${VERSION_NAME}-b${VERSION_CODE}-test-debug"
            ASSET_FILENAME="PRIVATE-VAULT-v${VERSION_NAME}-b${VERSION_CODE}-NON-PRODUCTION-DEBUG.apk"
          else
            RELEASE_TAG="v${VERSION_NAME}-b${VERSION_CODE}"
            ASSET_FILENAME="PRIVATE-VAULT-v${VERSION_NAME}-b${VERSION_CODE}.apk"
          fi
          ASSET_DOWNLOAD_URL="https://github.com/${PUBLIC_OTA_REPO}/releases/download/${RELEASE_TAG}/${ASSET_FILENAME}"

          STAGING_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ota-publish-XXXXXX")"
          STAGED_APK="${STAGING_DIR}/${ASSET_FILENAME}"
          STAGED_MANIFEST="${STAGING_DIR}/update.json"
          cp "${BUILT_APK}" "${STAGED_APK}"

          python3 - "${STAGED_MANIFEST}" "${VERSION_CODE}" "${VERSION_NAME}" "${ASSET_DOWNLOAD_URL}" "${APK_SHA256}" "${APK_SIZE_BYTES}" "${PUBLISHED_AT}" "${MIN_SUPPORTED_CODE}" "${RELEASE_NOTES}" <<'PY'
          import json, sys
          out_path, v_code, v_name, url, sha256_hex, size_b, pub_at, min_code, notes = sys.argv[1:10]
          manifest = {
              "schemaVersion": 1,
              "versionCode": int(v_code),
              "versionName": v_name,
              "apkUrl": url,
              "downloadUrl": url,
              "sha256": sha256_hex,
              "fileSizeBytes": int(size_b),
              "apkSizeBytes": int(size_b),
              "releaseNotes": notes,
              "publishedAt": pub_at,
              "minSupportedVersionCode": int(min_code)
          }
          with open(out_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

          {
            echo "version_code=${VERSION_CODE}"
            echo "version_name=${VERSION_NAME}"
            echo "apk_sha256=${APK_SHA256}"
            echo "apk_size_bytes=${APK_SIZE_BYTES}"
            echo "release_tag=${RELEASE_TAG}"
            echo "asset_filename=${ASSET_FILENAME}"
            echo "asset_download_url=${ASSET_DOWNLOAD_URL}"
            echo "staged_apk=${STAGED_APK}"
            echo "staged_manifest=${STAGED_MANIFEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload release asset to public OTA repository and verify HTTPS reachability before updating update.json
        env:
          GH_TOKEN: ${{ secrets.OTA_REPO_TOKEN }}
          RELEASE_TAG: ${{ steps.apk_meta.outputs.release_tag }}
          VERSION_NAME: ${{ steps.apk_meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk_meta.outputs.version_code }}
          STAGED_APK: ${{ steps.apk_meta.outputs.staged_apk }}
          STAGED_MANIFEST: ${{ steps.apk_meta.outputs.staged_manifest }}
          ASSET_DOWNLOAD_URL: ${{ steps.apk_meta.outputs.asset_download_url }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=()
          TITLE_PREFIX="PRIVATE VAULT"
          if [ "${SIGNING_MODE}" = "debug_compatibility" ]; then
            PRERELEASE_FLAG=(--prerelease)
            TITLE_PREFIX="[NON-PRODUCTION TEST] PRIVATE VAULT"
          fi

          if gh release view "${RELEASE_TAG}" --repo "${PUBLIC_OTA_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${STAGED_APK}" --repo "${PUBLIC_OTA_REPO}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${STAGED_APK}" \
              --repo "${PUBLIC_OTA_REPO}" \
              --title "${TITLE_PREFIX} v${VERSION_NAME} (Build ${VERSION_CODE})" \
              --notes "${RELEASE_NOTES}" \
              "${PRERELEASE_FLAG[@]}"
          fi

          echo "Verifying uploaded APK asset reachability at ${ASSET_DOWNLOAD_URL}..."
          HTTP_STATUS="$(curl -sSL -o /dev/null -w "%{http_code}" "${ASSET_DOWNLOAD_URL}")"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::Uploaded APK asset returned HTTP ${HTTP_STATUS} instead of 200. Aborting before update.json is modified."
            exit 1
          fi

          OTA_WORK_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ota-repo-checkout-XXXXXX")"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_OTA_REPO}.git" "${OTA_WORK_DIR}"
          cp "${STAGED_MANIFEST}" "${OTA_WORK_DIR}/update.json"
          git -C "${OTA_WORK_DIR}" config user.name "github-actions[bot]"
          git -C "${OTA_WORK_DIR}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${OTA_WORK_DIR}" add update.json
          if git -C "${OTA_WORK_DIR}" diff --cached --quiet; then
            echo "update.json is already up to date."
          else
            git -C "${OTA_WORK_DIR}" commit -m "Publish OTA manifest for v${VERSION_NAME} (versionCode ${VERSION_CODE})"
            git -C "${OTA_WORK_DIR}" push origin main
          fi

      - name: Clean up temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f ./debug.keystore "${RUNNER_TEMP}/release-signing.jks"
