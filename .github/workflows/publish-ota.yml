name: Publish PRIVATE VAULT OTA Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check required secrets
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          OTA_REPO_TOKEN: ${{ secrets.OTA_REPO_TOKEN }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "::error::DEBUG_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$OTA_REPO_TOKEN" || { echo "::error::Add OTA_REPO_TOKEN with Contents read/write access to tpeditz/Private-vault-updates"; exit 1; }

      - name: Restore trusted signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > debug.keystore
          keytool -list -v -keystore debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey > key-info.txt
          grep -Fq 'SHA256: 12:94:3A:91:69:28:04:92:69:C0:2D:8D:97:1B:59:67:A0:41:FB:6C:7D:B2:5A:12:79:D3:41:4E:45:CF:B5:61' key-info.txt

      - name: Build Build #4
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and prepare OTA metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          BADGING="$("$TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.tpeditz.privatevault' versionCode='3' versionName='1.0.2'" >/dev/null
          CERT="$("$TOOLS/apksigner" verify --print-certs "$APK" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$CERT" = "12943a916928049269c02d8d971b5967a041fb6c7db25a1279d3414e45cfb561"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(wc -c < "$APK" | tr -d '[:space:]')"
          NAME="private-vault-android-v1.0.2.apk"
          TAG="private-vault-v1.0.2-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          URL="https://github.com/tpeditz/Private-vault-updates/releases/download/$TAG/$NAME"
          cp "$APK" "$RUNNER_TEMP/$NAME"
          {
            echo "sha=$SHA"
            echo "size=$SIZE"
            echo "name=$NAME"
            echo "tag=$TAG"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK release to public OTA repository
        env:
          GH_TOKEN: ${{ secrets.OTA_REPO_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" "$RUNNER_TEMP/${{ steps.meta.outputs.name }}" \
            --repo tpeditz/Private-vault-updates \
            --title "PRIVATE VAULT v1.0.2 — OTA compatibility build" \
            --notes "Build #4. VersionCode 3. Same persistent signing certificate as installed Build #3. Compatibility test release."

      - name: Publish update.json manifest
        env:
          GH_TOKEN: ${{ secrets.OTA_REPO_TOKEN }}
          APK_SHA256: ${{ steps.meta.outputs.sha }}
          APK_SIZE: ${{ steps.meta.outputs.size }}
          APK_URL: ${{ steps.meta.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          manifest = {
              "versionCode": 3,
              "versionName": "1.0.2",
              "apkUrl": os.environ["APK_URL"],
              "sha256": os.environ["APK_SHA256"],
              "releaseNotes": "OTA compatibility test. Same persistent signing certificate as Build #3.",
              "publishedAt": datetime.now(timezone.utc).date().isoformat(),
              "fileSizeBytes": int(os.environ["APK_SIZE"])
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          API="repos/tpeditz/Private-vault-updates/contents/update.json"
          SHA="$(gh api "$API?ref=main" --jq '.sha' 2>/dev/null || true)"
          CONTENT="$(base64 -w 0 update.json)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" -f message="Publish PRIVATE VAULT v1.0.2 update manifest" -f content="$CONTENT" -f sha="$SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "$API" -f message="Publish PRIVATE VAULT v1.0.2 update manifest" -f content="$CONTENT" -f branch=main >/dev/null
          fi

      - name: Build summary
        if: always()
        run: |
          {
            echo "## PRIVATE VAULT OTA"
            echo "- Build target: 1.0.2 (versionCode 3)"
            echo "- OTA manifest: https://raw.githubusercontent.com/tpeditz/Private-vault-updates/main/update.json"
            echo "- Installed Build #3 was not modified."
          } >> "$GITHUB_STEP_SUMMARY"
